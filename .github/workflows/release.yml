name: Android Release

on:
  push:
    tags:
      - "enrouteCL-*"

permissions:
  contents: write

jobs:
  build-android-release:
    uses: ./.github/workflows/android.yml

  publish-release:
    needs: build-android-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-android-release.outputs.apk-artifact-name }}
          path: apk

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find apk -name '*.apk' | head -n 1)
          echo "Found APK: $APK_PATH"
          RENAMED_PATH="apk/${{ github.ref_name }}.apk"
          cp "$APK_PATH" "$RENAMED_PATH"
          echo "apk_path=$RENAMED_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

