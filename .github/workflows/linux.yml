name: Compile on Linux

run-name: Linux Build - ${{ github.event.head_commit.message }}

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - ".gitignore"
      - "README.md"
      # ignore CI for other platforms
      - ".github/workflows/android.yml"
      - ".github/workflows/api.yml"
      - ".github/workflows/ios.yml"
      - ".github/workflows/macos.yml"

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Enroute
      uses: actions/checkout@v4
      with:
        path: enroute
        submodules: recursive
        fetch-depth: 0
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: ==3.1.*
        cache: 'true'
        modules: 'qt5compat qtconnectivity qthttpserver qtimageformats qtlocation qtmultimedia qtpositioning qtserialport qtshadertools qtspeech qtwebsockets qtwebview'
        version: '6.8.0'
    - name: Install LinuxDeploy
      uses: miurahr/install-linuxdeploy-action@v1
      with:
        plugins: appimage
    - name: Install Additional Software
      run: |
        sudo apt install appstream extra-cmake-modules fuse libxcb-cursor0 ninja-build spirv-tools zipcmp zipmerge ziptool
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: linux
    - name: Compile Enroute Flight Navigation
      run: |
        cmake \
          -B build-enroute \
          -S enroute \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_CXX_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_INSTALL_PREFIX:STRING=$PWD/app/usr \
          -DQTDEPLOY=ON
        cmake --build build-enroute
        cmake --build build-enroute --target install
