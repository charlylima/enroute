name: Compile on MacOS

run-name: 🍎 macOS Build - ${{ github.event.head_commit.message }}

on:
  push:
    branches: [ develop ]
    paths-ignore:
      - ".gitignore"
      - "README.md"
      # ignore CI for other platforms
      - ".github/workflows/android.yml"
      - ".github/workflows/api.yml"
      - ".github/workflows/ios.yml"
      - ".github/workflows/linux.yml"

jobs:
  build:

    runs-on: macos-latest
    
    steps:
    - name: Checkout Enroute
      uses: actions/checkout@v4
      with:
        path: enroute
        submodules: recursive
        fetch-depth: 0
    - name: Set up macOS
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    - name: Install Ninja
      run: brew install ninja
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: 'true'
        version: '6.8.*'
        modules: 'qt5compat qtconnectivity qthttpserver qtimageformats qtlocation qtmultimedia qtpositioning qtserialport qtshadertools qtspeech qtwebsockets qtwebview'
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: macos
    - name: Compile Enroute Flight Navigation
      run: |
        cmake \
          -B build-enroute \
          -S enroute \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_CXX_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
          -DCMAKE_INSTALL_PREFIX=. \
          -DQTDEPLOY=ON 
        cmake --build build-enroute
